<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enter the Dream — Lucid Casino</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    /* ── Auth Page Layout ── */
    body { overflow: hidden; height: 100vh; }

    .auth-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100vh;
      position: relative;
      z-index: 1;
    }

    /* LEFT — Pure Aesthetic */
    .auth-left {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 60px;
      background: linear-gradient(135deg, #0d0508 0%, #1a0a0f 40%, #200a18 70%, #0d0508 100%);
    }

    .auth-left::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 100% 80% at 30% 30%, rgba(123,45,139,0.3) 0%, transparent 60%),
        radial-gradient(ellipse 80% 100% at 70% 80%, rgba(230,57,70,0.2) 0%, transparent 60%),
        radial-gradient(ellipse 60% 60% at 50% 50%, rgba(244,166,17,0.08) 0%, transparent 70%);
      animation: leftGlow 12s ease-in-out infinite alternate;
    }

    @keyframes leftGlow {
      0%   { transform: scale(1) rotate(0deg); opacity: 1; }
      50%  { transform: scale(1.08) rotate(2deg); opacity: 0.8; }
      100% { transform: scale(0.95) rotate(-1deg); opacity: 1.1; }
    }

    .auth-left::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(201,168,76,0.08) 1px, transparent 1px);
      background-size: 24px 24px;
      pointer-events: none;
    }

    .auth-logo {
      position: relative;
      z-index: 1;
      font-family: var(--font-display);
      font-size: clamp(3rem, 6vw, 6rem);
      font-weight: 900;
      font-style: italic;
      color: var(--text-cream);
      text-shadow: 0 0 60px rgba(201,168,76,0.5), 0 0 120px rgba(123,45,139,0.3);
      transform: rotate(-3deg);
      line-height: 1;
      text-align: center;
      letter-spacing: -0.02em;
    }

    .auth-logo span {
      display: block;
      font-size: 0.4em;
      font-weight: 400;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--text-gold);
      transform: rotate(0deg);
      margin-top: 8px;
      text-shadow: none;
      text-shadow: 0 0 20px rgba(201,168,76,0.5);
    }

    .quote-display {
      position: relative;
      z-index: 1;
      margin-top: 60px;
      max-width: 340px;
      text-align: center;
      font-family: var(--font-display);
      font-style: italic;
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .quote-text {
      opacity: 0;
      transition: opacity 1s ease;
    }

    .quote-text.visible {
      opacity: 1;
    }

    .quote-author {
      display: block;
      margin-top: 12px;
      font-size: 0.75rem;
      font-family: var(--font-body);
      font-style: normal;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: rgba(201,168,76,0.5);
    }

    /* Floating orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      animation: orbFloat linear infinite;
    }

    .orb-1 {
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(123,45,139,0.3), transparent 70%);
      top: 10%; left: -5%;
      animation-duration: 18s;
    }
    .orb-2 {
      width: 150px; height: 150px;
      background: radial-gradient(circle, rgba(230,57,70,0.2), transparent 70%);
      bottom: 15%; right: -3%;
      animation-duration: 14s;
      animation-delay: -7s;
    }
    .orb-3 {
      width: 80px; height: 80px;
      background: radial-gradient(circle, rgba(244,166,17,0.3), transparent 70%);
      top: 60%; left: 15%;
      animation-duration: 22s;
      animation-delay: -3s;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      33%       { transform: translateY(-30px) rotate(120deg); }
      66%       { transform: translateY(20px) rotate(240deg); }
    }

    /* RIGHT — Form Side */
    .auth-right {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 60px 60px 40px;
      background: linear-gradient(145deg, var(--bg-mid), var(--bg-deep));
      border-left: 1px solid var(--border-subtle);
      position: relative;
    }

    .auth-form-container {
      width: 100%;
      max-width: 420px;
    }

    .auth-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 40px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .auth-tab {
      flex: 1;
      padding: 14px;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      color: var(--text-muted);
      cursor: pointer;
      transition: all var(--transition-med);
      margin-bottom: -1px;
    }

    .auth-tab.active {
      color: var(--text-gold);
      border-bottom-color: var(--text-gold);
    }

    .auth-form-panel {
      display: none;
    }

    .auth-form-panel.active {
      display: block;
      animation: fadeInUp 0.4s ease forwards;
    }

    .auth-title {
      font-family: var(--font-display);
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--text-cream);
      margin-bottom: 8px;
    }

    .auth-subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 36px;
    }

    .auth-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .auth-footer button {
      background: none;
      border: none;
      color: var(--text-gold);
      cursor: pointer;
      font-size: 0.8rem;
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      body { overflow-y: auto; }
      .auth-container { grid-template-columns: 1fr; height: auto; }
      .auth-left { min-height: 280px; padding: 40px; }
      .auth-right { padding: 40px 24px; }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">
    <div class="auth-container">

      <!-- LEFT: Aesthetic -->
      <div class="auth-left">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>

        <div class="auth-logo stagger-1">
          Lucid
          <span>Casino Fever Dream</span>
        </div>

        <div class="quote-display stagger-3">
          <div class="quote-text" id="quote-text">
            "The dream is the small hidden door in the deepest and most intimate sanctum of the soul."
          </div>
          <span class="quote-author" id="quote-author">— C.G. Jung</span>
        </div>
      </div>

      <!-- RIGHT: Form -->
      <div class="auth-right">
        <div class="auth-form-container">

          <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</button>
            <button class="auth-tab" id="tab-register" onclick="switchTab('register')">Register</button>
          </div>

          <!-- Login Form -->
          <div class="auth-form-panel active" id="panel-login">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Step back into the dream.</p>

            <div id="login-error" class="error-msg"></div>

            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" id="login-email" class="form-input" placeholder="you@example.com" autocomplete="email" />
            </div>

            <div class="form-group">
              <label class="form-label">Password</label>
              <input type="password" id="login-password" class="form-input" placeholder="••••••••" autocomplete="current-password" />
            </div>

            <button class="btn btn-primary btn-lg" style="width:100%; margin-top:8px;" id="login-btn">
              Enter the Dream
            </button>

            <div class="auth-footer">
              No account? <button onclick="switchTab('register')">Create one</button>
            </div>
          </div>

          <!-- Register Form -->
          <div class="auth-form-panel" id="panel-register">
            <h1 class="auth-title">Join the Dream</h1>
            <p class="auth-subtitle">Your first step into something stranger.</p>

            <div id="register-error" class="error-msg"></div>
            <div id="register-success" class="success-msg"></div>

            <div class="form-group">
              <label class="form-label">Username</label>
              <input type="text" id="reg-username" class="form-input" placeholder="your dream name" autocomplete="username" />
            </div>

            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" id="reg-email" class="form-input" placeholder="you@example.com" autocomplete="email" />
            </div>

            <div class="form-group">
              <label class="form-label">Password</label>
              <input type="password" id="reg-password" class="form-input" placeholder="••••••••" autocomplete="new-password" />
            </div>

            <button class="btn btn-primary btn-lg" style="width:100%; margin-top:8px;" id="register-btn">
              Begin the Journey
            </button>

            <div class="auth-footer">
              Already dreaming? <button onclick="switchTab('login')">Sign in</button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
