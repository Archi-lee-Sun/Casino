<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hall of Fame — Lucid Casino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .leaderboard-header {
      text-align: center;
      padding: 3rem 2rem 2rem;
      position: relative;
    }

    .leaderboard-header::after {
      content: '';
      display: block;
      height: 2px;
      background: linear-gradient(90deg, transparent, #e63946, #f4a611, #7b2d8b, transparent);
      margin: 1.5rem auto 0;
      width: 60%;
      animation: shimmer 3s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.6; width: 40%; }
      50% { opacity: 1; width: 70%; }
    }

    .leaderboard-subtitle {
      font-family: 'Space Mono', monospace;
      color: #c9a84c;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      font-size: 0.75rem;
      margin-top: 0.5rem;
      opacity: 0.8;
    }

    .leaderboard-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
    }

    .hall-of-fame-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .player-row {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      align-items: center;
      gap: 1.5rem;
      padding: 1.5rem 2rem;
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      cursor: default;
      transition: transform 0.3s ease;
      opacity: 0;
      transform: translateY(30px);
      animation: rowReveal 0.6s ease forwards;
    }

    .player-row:nth-child(1) { animation-delay: 0.1s; }
    .player-row:nth-child(2) { animation-delay: 0.2s; }
    .player-row:nth-child(3) { animation-delay: 0.3s; }
    .player-row:nth-child(4) { animation-delay: 0.4s; }
    .player-row:nth-child(5) { animation-delay: 0.5s; }
    .player-row:nth-child(6) { animation-delay: 0.6s; }
    .player-row:nth-child(7) { animation-delay: 0.7s; }
    .player-row:nth-child(8) { animation-delay: 0.8s; }
    .player-row:nth-child(9) { animation-delay: 0.9s; }
    .player-row:nth-child(10) { animation-delay: 1.0s; }

    @keyframes rowReveal {
      to { opacity: 1; transform: translateY(0); }
    }

    .player-row:hover {
      transform: translateX(6px);
    }

    .player-row::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .player-row:hover::before {
      opacity: 1;
    }

    /* Rank 1 - Gold */
    .player-row.rank-1 {
      background: linear-gradient(135deg, rgba(201,168,76,0.15) 0%, rgba(26,10,15,0.9) 60%);
      border: 1px solid rgba(201,168,76,0.5);
      box-shadow: 0 0 30px rgba(201,168,76,0.2), inset 0 0 30px rgba(201,168,76,0.05);
      animation: goldGlow 3s ease-in-out infinite, rowReveal 0.6s ease 0.1s forwards;
    }

    @keyframes goldGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(201,168,76,0.2), inset 0 0 20px rgba(201,168,76,0.05); }
      50% { box-shadow: 0 0 50px rgba(201,168,76,0.4), inset 0 0 40px rgba(201,168,76,0.1); }
    }

    /* Rank 2 - Silver */
    .player-row.rank-2 {
      background: linear-gradient(135deg, rgba(192,192,192,0.1) 0%, rgba(26,10,15,0.9) 60%);
      border: 1px solid rgba(192,192,192,0.3);
      box-shadow: 0 0 20px rgba(192,192,192,0.1);
    }

    /* Rank 3 - Bronze */
    .player-row.rank-3 {
      background: linear-gradient(135deg, rgba(205,127,50,0.1) 0%, rgba(26,10,15,0.9) 60%);
      border: 1px solid rgba(205,127,50,0.3);
      box-shadow: 0 0 20px rgba(205,127,50,0.1);
    }

    /* Ranks 4-10 */
    .player-row.rank-other {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .rank-number {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-weight: 900;
      font-style: italic;
      text-align: center;
      line-height: 1;
    }

    .rank-1 .rank-number { color: #c9a84c; text-shadow: 0 0 20px rgba(201,168,76,0.8); }
    .rank-2 .rank-number { color: #c0c0c0; text-shadow: 0 0 15px rgba(192,192,192,0.5); }
    .rank-3 .rank-number { color: #cd7f32; text-shadow: 0 0 15px rgba(205,127,50,0.5); }
    .rank-other .rank-number { color: rgba(245,230,211,0.3); }

    .rank-medal {
      display: block;
      font-size: 0.7rem;
      font-family: 'Space Mono', monospace;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 0.2rem;
    }

    .rank-1 .rank-medal { color: #c9a84c; }
    .rank-2 .rank-medal { color: #c0c0c0; }
    .rank-3 .rank-medal { color: #cd7f32; }

    .player-info {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .player-username {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: #f5e6d3;
      letter-spacing: 0.02em;
    }

    .rank-1 .player-username {
      color: #f4d98e;
      text-shadow: 0 0 10px rgba(244,169,17,0.3);
    }

    .player-tag {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      color: rgba(245,230,211,0.35);
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }

    .player-balance {
      text-align: right;
    }

    .balance-amount {
      font-family: 'Space Mono', monospace;
      font-size: 1.4rem;
      font-weight: 700;
      color: #4a7c59;
    }

    .rank-1 .balance-amount {
      color: #c9a84c;
      text-shadow: 0 0 10px rgba(201,168,76,0.4);
    }

    .balance-label {
      display: block;
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      color: rgba(245,230,211,0.3);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-top: 0.2rem;
    }

    .crown-decoration {
      position: absolute;
      top: -8px;
      right: 20px;
      font-size: 1.8rem;
      animation: crownFloat 2s ease-in-out infinite;
    }

    @keyframes crownFloat {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-5px) rotate(5deg); }
    }

    .loading-state {
      text-align: center;
      padding: 4rem 2rem;
      font-family: 'Space Mono', monospace;
      color: rgba(245,230,211,0.4);
      letter-spacing: 0.1em;
    }

    .loading-state .spinner {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(201,168,76,0.2);
      border-top-color: #c9a84c;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    .error-state {
      text-align: center;
      padding: 3rem;
      color: #e63946;
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
    }

    .back-nav {
      position: fixed;
      top: 1.5rem;
      left: 2rem;
      z-index: 100;
    }

    .back-btn {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(245,230,211,0.5);
      text-decoration: none;
      border: 1px solid rgba(245,230,211,0.15);
      padding: 0.5rem 1rem;
      border-radius: 2px;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .back-btn:hover {
      color: #f4a611;
      border-color: #f4a611;
      box-shadow: 0 0 15px rgba(244,166,17,0.2);
    }

    .decorative-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0 2rem;
      opacity: 0.3;
    }

    .decorative-divider::before,
    .decorative-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c9a84c);
    }

    .decorative-divider::after {
      background: linear-gradient(90deg, #c9a84c, transparent);
    }

    .divider-symbol {
      font-family: 'Playfair Display', serif;
      color: #c9a84c;
      font-size: 1.2rem;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 3rem;
      padding: 1.5rem;
      margin-bottom: 2rem;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 4px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-family: 'Space Mono', monospace;
      font-size: 1.2rem;
      color: #f4a611;
      display: block;
    }

    .stat-label {
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      color: rgba(245,230,211,0.3);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }
  </style>
</head>
<body>
  <div class="grain-overlay"></div>
  <div class="bg-gradient-shift"></div>

  <nav class="back-nav">
    <a href="dashboard.html" class="back-btn">← Dashboard</a>
  </nav>

  <div class="page-content">
    <header class="leaderboard-header">
      <h1 class="page-title" style="font-size: clamp(2.5rem, 6vw, 5rem);">Hall of Fame</h1>
      <p class="leaderboard-subtitle">The Luminaries of the Lucid Dream</p>
    </header>

    <div class="leaderboard-container">
      <div class="stats-bar" id="statsBar" style="display:none;">
        <div class="stat-item">
          <span class="stat-value" id="totalPlayers">—</span>
          <span class="stat-label">Players Ranked</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="topBalance">—</span>
          <span class="stat-label">Top Balance</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="avgBalance">—</span>
          <span class="stat-label">Avg Balance</span>
        </div>
      </div>

      <div class="decorative-divider">
        <span class="divider-symbol">✦</span>
      </div>

      <div id="leaderboardContent">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Summoning the legends...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/leaderboard.js"></script>
</body>
</html>
